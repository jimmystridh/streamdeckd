# streamdeckd — Command Center configuration template.
#
# Installed to ~/Library/Application Support/streamdeckd/config.toml only when no
# user configuration exists. Reloads are transactional: an invalid edit leaves the
# previous configuration active and is reported by `streamdeckctl status`.

version = 1
# Optional: set this in a local config when multiple decks are connected.
# device_serial = "your-device-serial"
startup_page = "home"
# Used as the fallback when automatic brightness is disabled or unavailable.
brightness = 60
long_press_ms = 600
temporary_panel_seconds = 10
blank_on_exit = false

[ambient_brightness]
enabled = true
minimum = 15
maximum = 75

[location]
name = "Stensjön"
latitude = 57.6627
longitude = 12.0341
timezone = "Europe/Stockholm"

[lake]
id = "A84041BDC1864B41"

[pomodoro]
focus_minutes = 25
short_break_minutes = 5
long_break_minutes = 15
long_break_every = 4
sound = "Glass"
repeat_sound_seconds = 30
persistent_alert = true

[meetings]
# Add calendar accounts in a local config if desired.
accounts = []
horizon_days = 14
max_events = 100
meet_app = "~/Applications/Chrome Apps.localized/Google Meet.app"

[github]
updated_within_days = 30
item_limit = 100

[[github.repository_aliases]]
prefix = "visma.administration."
replacement = "admin."

[ci]
repositories = [
  "jimmystridh/codex-sdk-swift",
  "jimmystridh/codex-sdk-rs",
  "jimmystridh/streamdeckd",
]

[quick_capture]
personal_vault = "JS-Agent"
work_vault = "JS-Visma-Agent"
folder = "Inbox"

[network]
vpn_name = "Tailscale"
vpn_application = "Tailscale"

[vasttrafik]
[[vasttrafik.stops]]
label = "Gårdatorget"
gid = "9021014002140000"
line = "754"
direction = "Mölndal resecentrum"

[[vasttrafik.stops]]
label = "Tallkotten"
gid = "9021014012521000"
line = "754"
direction = "Heden"

[usage]
warning_percent = 50
critical_percent = 80

[wispr]
[[wispr.microphones]]
label = "MacBook"
name = "Built-in mic"

[[wispr.microphones]]
label = "Bose"
name = "Bose NC 700 Headphones"

[[wispr.microphones]]
label = "RØDE"
name = "RODE NT-USB"

[[spotify.playlists]]
label = "Recent 1"
uri = "spotify:playlist:1jnizfcJFNGVeJgmp7ngK9"

[[spotify.playlists]]
label = "Recent 2"
uri = "spotify:playlist:37i9dQZF1FgnTBfUlzkeKt"

[[spotify.playlists]]
label = "Recent 3"
uri = "spotify:playlist:37i9dQZF1DXc1uuASu7T9L"

[[spotify.playlists]]
label = "Recent 4"
uri = "spotify:playlist:37i9dQZF1DZ06evO0mG1Nf"

[[spotify.playlists]]
